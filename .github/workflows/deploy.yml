name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Check configuration
        run: |
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "Set the AWS_DEPLOY_ROLE_ARN variable"; exit 1; }
          test -n "${{ vars.OWNER_EMAIL }}" || { echo "Set the OWNER_EMAIL variable"; exit 1; }
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run web:install
      - run: bun run web:build
      - working-directory: infra
        run: >
          bunx cdk deploy --all --require-approval never
          -c ownerEmail="${{ vars.OWNER_EMAIL }}"
